    <text x="535" y="134" dy="0.35em" class="badge-text">PK</text>
    <text x="558" y="134" dy="0.35em" class="attr-text">id_inventario</text>
    
    <!-- cantidad_disponible -->
    <text x="558" y="162" dy="0.35em" class="attr-text">cantidad_disponible</text>
    <!-- cantidad_en_bodega -->
    <text x="558" y="190" dy="0.35em" class="attr-text">cantidad_en_bodega</text>
    <!-- cantidad_en_exhibición -->
    <text x="558" y="218" dy="0.35em" class="attr-text">cantidad_en_exhibición</text>
    <!-- fecha_actualización -->
    <text x="558" y="246" dy="0.35em" class="attr-text">fecha_actualización</text>
  </g>

  <!-- Tabla 4: Producto (Morado) -->
  <g>
    <rect x="752" y="88" width="176" height="180" rx="10" fill="#F4EBFF" stroke="#C9A6EE" stroke-width="1.5"/>
    <text x="840" y="109" class="table-title" fill="#7439B8">Producto</text>
    <path d="M 752,120 H 928" stroke="#C9A6EE" stroke-width="1.5"/>
    
    <!-- id_producto (PK) -->
    <rect x="762" y="125" width="26" height="18" rx="9" fill="#7439B8"/>
    <text x="775" y="134" dy="0.35em" class="badge-text">PK</text>
    <text x="798" y="134" dy="0.35em" class="attr-text">id_producto</text>
    
    <!-- nombre -->
    <text x="798" y="162" dy="0.35em" class="attr-text">nombre</text>
    <!-- código_barras -->
    <text x="798" y="190" dy="0.35em" class="attr-text">código_barras</text>
    <!-- categoría -->
    <text x="798" y="218" dy="0.35em" class="attr-text">categoría</text>
    <!-- unidad_medida -->
    <text x="798" y="246" dy="0.35em" class="attr-text">unidad_medida</text>
  </g>

  <!-- ==================== FILA 2 DE TABLAS ==================== -->

  <!-- Tabla 5: Tarea (Azul) -->
  <g>
    <rect x="32" y="332" width="176" height="208" rx="10" fill="#EEF1FF" stroke="#A9B4F2" stroke-width="1.5"/>
    <text x="120" y="353" class="table-title" fill="#4453C9">Tarea</text>
    <path d="M 32,364 H 208" stroke="#A9B4F2" stroke-width="1.5"/>
    
    <!-- id_tarea (PK) -->
    <rect x="42" y="369" width="26" height="18" rx="9" fill="#4453C9"/>
    <text x="55" y="378" dy="0.35em" class="badge-text">PK</text>
    <text x="78" y="378" dy="0.35em" class="attr-text">id_tarea</text>
    
    <!-- descripción -->
    <text x="78" y="406" dy="0.35em" class="attr-text">descripción</text>
    <!-- prioridad -->
    <text x="78" y="434" dy="0.35em" class="attr-text">prioridad</text>
    <!-- estado -->
    <text x="78" y="462" dy="0.35em" class="attr-text">estado</text>
    <!-- fecha_asignación -->
    <text x="78" y="490" dy="0.35em" class="attr-text">fecha_asignación</text>
    <!-- fecha_cierre -->
    <text x="78" y="518" dy="0.35em" class="attr-text">fecha_cierre</text>
  </g>

  <!-- Tabla 6: Empleado (Verde) -->
  <g>
    <rect x="272" y="332" width="176" height="180" rx="10" fill="#E3F6F3" stroke="#86D3CA" stroke-width="1.5"/>
    <text x="360" y="353" class="table-title" fill="#0F8478">Empleado</text>
    <path d="M 272,364 H 448" stroke="#86D3CA" stroke-width="1.5"/>
    
    <!-- id_empleado (PK) -->
    <rect x="282" y="369" width="26" height="18" rx="9" fill="#0F8478"/>
    <text x="295" y="378" dy="0.35em" class="badge-text">PK</text>
    <text x="318" y="378" dy="0.35em" class="attr-text">id_empleado</text>
    
    <!-- nombre -->
    <text x="318" y="406" dy="0.35em" class="attr-text">nombre</text>
    <!-- correo -->
    <text x="318" y="434" dy="0.35em" class="attr-text">correo</text>
    <!-- rol -->
    <text x="318" y="462" dy="0.35em" class="attr-text">rol</text>
    <!-- estado -->
    <text x="318" y="490" dy="0.35em" class="attr-text">estado</text>
  </g>

  <!-- Tabla 7: MovimientoInventario (Ámbar) -->
  <g>
    <rect x="512" y="332" width="176" height="236" rx="10" fill="#FFF3DC" stroke="#F0C572" stroke-width="1.5"/>
    <text x="600" y="353" class="table-title" fill="#A96C05">MovimientoInventario</text>
    <path d="M 512,364 H 688" stroke="#F0C572" stroke-width="1.5"/>
    
    <!-- id_movimiento (PK) -->
    <rect x="522" y="369" width="26" height="18" rx="9" fill="#A96C05"/>
    <text x="535" y="378" dy="0.35em" class="badge-text">PK</text>
    <text x="558" y="378" dy="0.35em" class="attr-text">id_movimiento</text>
    
    <!-- tipo_movimiento -->
    <text x="558" y="406" dy="0.35em" class="attr-text">tipo_movimiento</text>
    <!-- cantidad -->
    <text x="558" y="434" dy="0.35em" class="attr-text">cantidad</text>
    <!-- fecha_hora -->
    <text x="558" y="462" dy="0.35em" class="attr-text">fecha_hora</text>
    <!-- motivo -->
    <text x="558" y="490" dy="0.35em" class="attr-text">motivo</text>
    <!-- cantidad_anterior -->
    <text x="558" y="518" dy="0.35em" class="attr-text">cantidad_anterior</text>
    <!-- cantidad_nueva -->
    <text x="558" y="546" dy="0.35em" class="attr-text">cantidad_nueva</text>
  </g>

  <!-- Tabla 8: Novedad (Morado) -->
  <g>
    <rect x="752" y="332" width="176" height="208" rx="10" fill="#F4EBFF" stroke="#C9A6EE" stroke-width="1.5"/>
    <text x="840" y="353" class="table-title" fill="#7439B8">Novedad</text>
    <path d="M 752,364 H 928" stroke="#C9A6EE" stroke-width="1.5"/>
    
    <!-- id_novedad (PK) -->
    <rect x="762" y="369" width="26" height="18" rx="9" fill="#7439B8"/>
    <text x="775" y="378" dy="0.35em" class="badge-text">PK</text>
    <text x="798" y="378" dy="0.35em" class="attr-text">id_novedad</text>
    
    <!-- tipo_novedad -->
    <text x="798" y="406" dy="0.35em" class="attr-text">tipo_novedad</text>
    <!-- descripción -->
    <text x="798" y="434" dy="0.35em" class="attr-text">descripción</text>
    <!-- cantidad_afectada -->
    <text x="798" y="462" dy="0.35em" class="attr-text">cantidad_afectada</text>
    <!-- fecha_hora -->
    <text x="798" y="490" dy="0.35em" class="attr-text">fecha_hora</text>
    <!-- estado -->
    <text x="798" y="518" dy="0.35em" class="attr-text">estado</text>
  </g>

  <!-- ==================== PIE DE DIAGRAMA ==================== -->
  <text x="480" y="614" class="footer-text">Relaciones 1:N — La barra vertical (|) indica el lado uno (1) y la pata de gallo (⤚) indica el lado muchos (N)</text>
</svg>
