    <text x="295" y="134" dy="0.35em" class="badge-text">PK</text>
    <text x="318" y="134" dy="0.35em" class="attr-text">id_tienda</text>
    
    <!-- nombre -->
    <text x="318" y="162" dy="0.35em" class="attr-text">nombre</text>
    <!-- dirección -->
    <text x="318" y="190" dy="0.35em" class="attr-text">dirección</text>
    <!-- estado -->
    <text x="318" y="218" dy="0.35em" class="attr-text">estado</text>
  </g>

  <!-- Tabla 3: Inventario (Ámbar) -->
  <g>
    <rect x="512" y="88" width="176" height="180" rx="10" fill="#FFF3DC" stroke="#F0C572" stroke-width="1.5"/>
